{% extends 'base.html' %}
{% block title %}Profile | Mini Blog{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="fw-bold mb-4">Profile</h1>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h2 class="fw-bold">Welcome, {{ user.username }}!</h2>
            <p>Email: {{ user.email }}</p>
        </div>
    </div>

    <h3 class="fw-bold mb-3">My Posts</h3>
    {% for post in posts %}
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-body">
                <h5>{{ post.title }}</h5>
                <a href="{% url 'post_detail' post.slug %}" class="btn btn-outline-dark btn-sm">View</a>
            </div>
        </div>
    {% empty %}
        <div class="alert alert-info">You haven't created any posts yet.</div>
    {% endfor %}
</div>
{% endblock %}
