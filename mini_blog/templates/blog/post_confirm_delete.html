{% extends 'base.html' %}
{% block title %}Delete Post | Mini Blog{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="fw-bold mb-4">Delete Post</h1>
    <p>Are you sure you want to delete: <strong>{{ post.title }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'post_detail' post.slug %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
